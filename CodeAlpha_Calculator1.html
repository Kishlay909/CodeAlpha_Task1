<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .calculator {
            background-color: #1a1a1a;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);
            width: 340px;
        }

        .display {
            background-color: #2a2a2a;
            color: #ffffff;
            width: 100%;
            height: 80px;
            border: none;
            border-radius: 10px;
            margin-bottom: 20px;
            padding: 15px;
            font-size: 2rem;
            text-align: right;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 20px;
            font-size: 1.25rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #333333;
            color: #ffffff;
        }

        button:hover {
            background-color: #444444;
            transform: scale(1.05);
        }

        button.operator {
            background-color: #ff9f0a;
            color: white;
        }

        button.operator:hover {
            background-color: #cc7f08;
        }

        button.clear {
            background-color: #a5a5a5;
            color: black;
        }

        button.clear:hover {
            background-color: #8e8e8e;
        }

        button.equal {
            background-color: #30d158;
            color: white;
            grid-column: span 2; 
        }

        button.equal:hover {
            background-color: #24a142;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" class="display" id="screen" readonly placeholder="0">
        
        <div class="buttons">
            <button class="clear" onclick="clearScreen()">C</button>
            <button class="clear" onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="equal" onclick="calculateResult()">=</button>

            <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendValue('.')">.</button>
        </div>
    </div>

    <script>
        const screen = document.getElementById('screen');

        function appendValue(value) {
            const lastChar = screen.value.slice(-1);
            const operators = ['+', '-', '*', '/'];
            
            if (operators.includes(value) && operators.includes(lastChar)) {
                
                screen.value = screen.value.slice(0, -1) + value;
            } else {
                screen.value += value;
            }
        }

        function clearScreen() {
            screen.value = '';
        }

        function deleteLast() {
            screen.value = screen.value.slice(0, -1);
        }

        function calculateResult() {
            try {
                if (screen.value.trim() === "") return;

                const result = new Function(`return ${screen.value}`)();
                if (result === Infinity || isNaN(result)) {
                    screen.value = "Error";
                } else {   
                    screen.value = Number(result.toFixed(4)).toString();
                }
            } catch (error) {
                screen.value = 'Error';
            }
        }

        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (key >= '0' && key <= '9' || key === '.') {
                appendValue(key);
            } else if (key === '+') {
                appendValue('+');
            } else if (key === '-') {
                appendValue('-');
            } else if (key === '*') {
                appendValue('*');
            } else if (key === '/') {
                appendValue('/');
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault(); 
                calculateResult();
            } else if (key === 'Backspace') {
                deleteLast();
            } else if (key === 'Escape') {
                clearScreen();
            }
        });
    </script>
</body>
</html>
